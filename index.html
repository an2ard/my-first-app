<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador de Eventos | Colegio Bolívar</title>

    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript externo -->
    <script src="actions.js" defer></script>
</head>

<body>
    <main class="contador">

        <div class="etiqueta">Event Counter</div>

        <h1 id="tituloEvento">Colegio Bolívar</h1>

        <p class="descripcion">
            Contador interactivo de clicks<br>
            para eventos escolares
        </p>

        <div class="campo-titulo">
            <label for="nuevoTitulo">Título del evento</label>

            <input
                type="text"
                id="nuevoTitulo"
                placeholder="Escribe el nombre del evento..."
                value="Colegio Bolívar"
                maxlength="100"
            >
        </div>

        <div
            id="numero"
            aria-live="polite"
            aria-atomic="true"
        >0</div>

        <div class="botones">

            <button id="sumar" type="button">
                + Registrar click
            </button>

            <button id="reiniciar" type="button">
                Reiniciar contador
            </button>

        </div>

        <p id="mensaje" role="status" aria-live="polite">
            ¡Listo para comenzar!
        </p>

        <div class="linea"></div>

        <footer class="pie">
            Colegio Bolívar · Eventos
        </footer>

    </main>
</body>
</html>
