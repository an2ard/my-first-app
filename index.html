<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clicks | Colegio Bolívar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #050b1e, #0b1735, #10102b);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .contador {
            background: rgba(12, 24, 52, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 24px;
            padding: 45px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .etiqueta {
            display: inline-block;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
        }

        .descripcion {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        #numero {
            font-size: 88px;
            font-weight: 800;
            line-height: 1.2;
            color: #00e5ff;
            margin: 35px 0;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
            font-variant-numeric: tabular-nums;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px 22px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease,
                        background 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        #sumar {
            color: #04111f;
            background: #00e5ff;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.25);
        }

        #sumar:hover {
            background: #65f2ff;
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.45);
        }

        #reiniciar {
            color: #e2e8f0;
            background: #172442;
            border: 1px solid #334568;
        }

        #reiniciar:hover {
            background: #223354;
        }

        #mensaje {
            color: #94a3b8;
            font-size: 13px;
            margin: 25px 0 0;
            min-height: 20px;
        }

        .linea {
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 229, 255, 0.4),
                transparent
            );
            margin-top: 28px;
        }

        .pie {
            color: #64748b;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 18px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .contador {
                padding: 35px 22px;
            }

            h1 {
                font-size: 24px;
            }

            #numero {
                font-size: 72px;
            }
        }
    </style>
</head>

<body>
    <main class="contador">
        <div class="etiqueta">Event Counter</div>

        <h1>Colegio Bolívar</h1>

        <p class="descripcion">
            Contador interactivo de clicks<br>
            para eventos escolares
        </p>

        <div id="numero" aria-live="polite" aria-atomic="true">0</div>

        <div class="botones">
            <button id="sumar" onclick="incrementar()">
                + Registrar click
            </button>

            <button id="reiniciar" onclick="reiniciar()">
                Reiniciar contador
            </button>
        </div>

        <p id="mensaje" role="status">¡Listo para comenzar!</p>

        <div class="linea"></div>

        <div class="pie">Colegio Bolívar · Eventos</div>
    </main>

    <script>
        let clicks = 0;

        function incrementar() {
            clicks++;
            actualizarContador();
        }

        function reiniciar() {
            clicks = 0;
            actualizarContador();
            document.getElementById("mensaje").textContent =
                "El contador se ha reiniciado.";
        }

        function actualizarContador() {
            document.getElementById("numero").textContent = clicks;

            if (clicks === 0) {
                document.getElementById("mensaje").textContent =
                    "¡Listo para comenzar!";
            } else if (clicks === 1) {
                document.getElementById("mensaje").textContent =
                    "¡Primer click registrado!";
            } else {
                document.getElementById("mensaje").textContent =
                    clicks + " clicks registrados";
            }
        }
    </script>
</body>
</html>
