<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clicks | Colegio Bolívar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contador {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 85%;
        }

        h1 {
            color: #174a7e;
            font-size: 26px;
        }

        p {
            color: #6b7280;
        }

        #numero {
            font-size: 64px;
            font-weight: bold;
            color: #174a7e;
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            cursor: pointer;
            margin: 6px;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: scale(1.04);
            opacity: 0.9;
        }

        #sumar {
            background: #174a7e;
            color: white;
        }

        #reiniciar {
            background: #e5e7eb;
            color: #1f2937;
        }

        #mensaje {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <main class="contador">
        <h1>Colegio Bolívar</h1>
        <p>Contador interactivo de clicks para eventos</p>

        <div id="numero" aria-live="polite">0</div>

        <button id="sumar" onclick="incrementar()">
            +1 Click
        </button>

        <button id="reiniciar" onclick="reiniciar()">
            Reiniciar
        </button>

        <p id="mensaje">¡Comienza a contar!</p>
    </main>

    <script>
        let clicks = 0;

        function incrementar() {
            clicks++;
            actualizarContador();
        }

        function reiniciar() {
            clicks = 0;
            actualizarContador();
            document.getElementById("mensaje").textContent =
                "El contador se ha reiniciado.";
        }

        function actualizarContador() {
            document.getElementById("numero").textContent = clicks;

            if (clicks === 0) {
                document.getElementById("mensaje").textContent =
                    "¡Comienza a contar!";
            } else if (clicks === 1) {
                document.getElementById("mensaje").textContent =
                    "¡Primer click registrado!";
            } else {
                document.getElementById("mensaje").textContent =
                    "Clicks registrados: " + clicks;
            }
        }
    </script>

</body>
</html>
